<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Odoo Tracker - Amr</title>
    <style>
        body { background: #0D1117; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        .box { background: #161B22; border: 1px solid #30363D; padding: 20px; border-radius: 12px; max-width: 500px; margin: auto; }
        input { width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #30363D; background: #0D1117; color: white; }
        button { background: #2EA043; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎯 مساعد عمرو ربيع</h2>
        <div id="chat" style="height: 200px; overflow-y: auto; margin-bottom: 10px; text-align: right; border-bottom: 1px solid #30363D;"></div>
        <input type="text" id="userInput" placeholder="اكتب عملت إيه دلوقتي...">
        <button onclick="sendToGemini()">إرسال</button>
    </div>

    <script>
        async function sendToGemini() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const text = input.value;
            
            // بيجيب المفتاح اللي أنت خزنته قبل كده أو بيطلبه منك
            let apiKey = localStorage.getItem('MY_API_KEY');
            if (!apiKey) {
                apiKey = prompt("من فضلك دخل الـ API Key بتاع جوجل:");
                localStorage.setItem('MY_API_KEY', apiKey);
            }

            chat.innerHTML += `<div>👤: ${text}</div>`;
            input.value = '';

            try {
                // ده الرابط الصحيح والمستقر
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: "أنت مساعد عمرو ربيع مستشار Odoo. رد بإيجاز على: " + text }] }] })
                });

                const data = await response.json();
                const reply = data.candidates[0].content.parts[0].text;
                chat.innerHTML += `<div style="color: #2EA043;">🤖: ${reply}</div>`;
            } catch (e) {
                chat.innerHTML += `<div style="color: red;">❌ حصل خطأ، اتأكد من الـ API Key.</div>`;
            }
        }
    </script>
</body>
</html>
